name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build.sh uses the commit count as the build number
      - name: Tag must match VERSION in build.sh
        run: |
          version=$(sed -n 's/^VERSION=//p' build.sh)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$version in build.sh"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Unit tests
        run: swift test --scratch-path "$RUNNER_TEMP/bodega-build"
      - name: Build and package
        run: |
          ./build.sh
          codesign --verify --strict build.noindex/Bodega.app
          zip="Bodega-$VERSION-macos-arm64.zip"
          ditto -c -k --keepParent build.noindex/Bodega.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "Bodega $VERSION" --notes-from-tag
